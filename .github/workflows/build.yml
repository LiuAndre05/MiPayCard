name: Build MiPayCard APK

on:
#  push:
#    branches: [ master, main ]
#    paths-ignore:
#      - '**.md'
#      - '.github/**'
#      - '!.github/workflows/**'
#  pull_request:
#    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

env:
  JAVA_VERSION: '11'              # 保持 11，完美匹配 AGP 7.3.1
  ANDROID_SDK_PLATFORM: 30        # 匹配 compileSdkVersion 30
  ANDROID_BUILD_TOOLS: 30.0.3     # 匹配 AGP 7.3.1 推荐

permissions:
  contents: write   # 允许创建 Release (打 tag 时)

jobs:
  build:
    name: 构建 APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      # 关键修复：绕过 setup-android@v3 强制下载 JDK17 版 cmdline-tools 的问题
      - name: 配置预装 Android SDK 环境
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH

      - name: 接受许可并安装 SDK 组件
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-${{ env.ANDROID_SDK_PLATFORM }}" \
                     "build-tools;${{ env.ANDROID_BUILD_TOOLS }}" \
                     "platform-tools"

      - name: 切换回 JDK 11（供 Gradle 构建使用）
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: 配置 local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: 缓存 Gradle Wrapper 和依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 授予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 验证 Gradle 环境
        run: |
          java -version
          ./gradlew --version

      - name: 构建 ${{ github.event.inputs.build_type || 'release' }} APK
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'release' }}"
          echo "开始构建: assemble${BUILD_TYPE^}"
          ./gradlew "assemble${BUILD_TYPE^}" --stacktrace --info
        env:
          GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.parallel=true'

      - name: 提取版本信息
        id: version
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle)
          VERSION_CODE=$(grep -oP 'versionCode\s+\K[0-9]+' app/build.gradle)
          BUILD_TYPE="${{ github.event.inputs.build_type || 'release' }}"
          COMMIT_SHA=$(git rev-parse --short HEAD)
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "build_type=$BUILD_TYPE" >> $GITHUB_OUTPUT
          echo "commit_sha=$COMMIT_SHA" >> $GITHUB_OUTPUT
          echo "构建版本: v${VERSION_NAME} (${VERSION_CODE}) - ${BUILD_TYPE} - ${COMMIT_SHA}"

      - name: 重命名 APK
        run: |
          BUILD_TYPE="${{ steps.version.outputs.build_type }}"
          APK_DIR="app/build/outputs/apk/${BUILD_TYPE}"
          if [ -d "$APK_DIR" ]; then
            for apk in "$APK_DIR"/*.apk; do
              if [ -f "$apk" ]; then
                BASENAME=$(basename "$apk" .apk)
                NEWNAME="MiPayCard-v${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.build_type }}-${{ steps.version.outputs.commit_sha }}-${BASENAME}.apk"
                mv "$apk" "$APK_DIR/$NEWNAME"
                echo "重命名: $BASENAME.apk -> $NEWNAME"
              fi
            done
          fi

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: MiPayCard-v${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.build_type }}
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30
          compression-level: 0

      - name: 生成构建摘要
        if: always()
        run: |
          echo "## 构建结果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 项目 | 值 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| 版本 | ${{ steps.version.outputs.version_name }} (${{ steps.version.outputs.version_code }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| 类型 | ${{ steps.version.outputs.build_type }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 提交 | ${{ steps.version.outputs.commit_sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 状态 | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ 构建成功！请在 Artifacts 中下载 APK。" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ 构建失败，请查看日志。" >> $GITHUB_STEP_SUMMARY
          fi

  release:
    name: 创建 Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
